<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#233729">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meal Plan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Mediterranean Weekly Plan</title>
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <p class="eyebrow">MEDITERRANEAN · HEART-FRIENDLY</p>
      <h1 id="appTitle">Weekly Plan</h1>
      <p id="weekLabel" class="subtitle"></p>
      <p id="intro" class="intro"></p>
    </div>
    <div class="hero-actions">
      <label class="language-label" for="languageSelect" id="languageLabel">Language</label>
      <select id="languageSelect" class="language-select" aria-label="Language">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="it">Italiano</option>
      </select>
      <button id="refreshButton" class="icon-button" aria-label="Refresh plan">↻</button>
    </div>
  </header>

  <main>
    <section id="installHint" class="install-hint hidden">
      <div>
        <strong id="installTitle"></strong>
        <span id="installText"></span>
      </div>
      <button id="closeInstallHint" type="button">OK</button>
    </section>

    <section id="summary" class="summary"></section>

    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-target="planView" id="tabPlan"></button>
      <button class="tab" data-target="shoppingView" id="tabShopping"></button>
      <button class="tab" data-target="prepView" id="tabPrep"></button>
      <button class="tab" data-target="notesView" id="tabNotes"></button>
    </nav>

    <section id="planView" class="view active"><div id="days" class="days"></div></section>

    <section id="shoppingView" class="view">
      <div class="section-bar">
        <div><h2 id="shoppingTitle"></h2><p id="shoppingSubtitle"></p></div>
        <button id="resetShopping" class="secondary"></button>
      </div>
      <div id="shopping" class="shopping-grid"></div>
    </section>

    <section id="prepView" class="view">
      <div class="section-bar"><div><h2 id="prepTitle"></h2><p id="prepSubtitle"></p></div></div>
      <div id="prep" class="prep-grid"></div>
    </section>

    <section id="notesView" class="view">
      <div class="section-bar"><div><h2 id="notesTitle"></h2><p id="notesSubtitle"></p></div></div>
      <textarea id="notes"></textarea>
    </section>

    <section class="medical-note"><strong id="medicalPrefix"></strong><span id="medicalText"></span></section>
  </main>

  <footer><span id="updated"></span><button id="printButton" onclick="window.print()"></button></footer>
  <script src="app.js"></script>
</body>
</html>
