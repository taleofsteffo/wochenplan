name: Deploy meal plan app without API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare site artifact
        run: |
          rm -rf _site
          mkdir -p _site

          for file in index.html styles.css app.js manifest.webmanifest sw.js plan.json offers.json market-config.json .nojekyll; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          if [ -d icons ]; then
            cp -R icons _site/icons
          fi

          test -f _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
