name: Update plan, prices and deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "37 7 * * 0"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meal-plan-and-prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install generator dependencies
        if: github.event_name != 'push'
        run: python -m pip install --upgrade -r requirements-automation.txt

      - name: Generate multilingual weekly meal plan
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generate_plan.py

      - name: Research German and Italian grocery prices
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OFFER_MODEL: gpt-5.6-terra
        run: python scripts/generate_offers.py

      - name: Commit generated plan and price research
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.json offers.json history/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update weekly meal plan and grocery prices [skip ci]"
            git push
          fi

      - name: Prepare site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js plan.json offers.json market-config.json .nojekyll _site/
          cp -R icons _site/icons

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
